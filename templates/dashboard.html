<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include 'nav.html' %}
    <div class="container">
        <h1>Welcome, {{ username }}!</h1>
        <h2>Account Balance: ${{'%0.2f'| format(balance|float)}}</h2>
        <div class="button-container">
            <button onclick="location.href='/transfer'">Transfer Money</button>
            <button onclick="location.href='/transactions'">Transaction History</button>
            <button onclick="location.href='/?page=templates/stocks.html'">Stocks</button>
            <!-- Vulnerable: leftover debug code expost in comments -->
            <!-- <button onclick="location.href='/insert'">[Work In Progress] Send Pickled Databases</button> -->
        </div>
        <div class="dashboard-grid">
            <div class="dashboard-card">
                <h3>Spending Breakdown</h3>
                <img src="/static/spending_chart.svg" alt="Spending Chart">
            </div>
            <div class="dashboard-card">
                <h3>Monthly Balance</h3>
                <img src="/static/balance_chart.svg" alt="Balance Chart">
            </div>
            <div class="dashboard-card">
                <h3>Portfolio Growth</h3>
                <img src="/static/growth_chart.svg" alt="Growth Chart">
            </div>
            <div class="dashboard-card">
                <h3>Asset Allocation</h3>
                <img src="/static/allocation_chart.svg" alt="Allocation Chart">
            </div>
            <div class="dashboard-card">
                <h3>Weekly Activity</h3>
                <img src="/static/activity_chart.svg" alt="Activity Chart">
            </div>
            <div class="dashboard-card">
                <h3>Your Advisor</h3>
                <img src="/static/advisor.jpg" alt="Financial Advisor" style="border-radius: 5px;">
            </div>
        </div>
    </div>

</body>
</html>
